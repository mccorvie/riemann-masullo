name: Stop merged PR check

on:
  pull_request_target:
    branches: [main]
    types: [closed, converted_to_draft]

permissions: {}

jobs:
  stop:
    runs-on: ubuntu-latest
    # Match the group in pr_check.yml. Queueing this job cancels any in-flight check
    # when a PR is closed (merged or unmerged) or converted to draft.
    concurrency:
      group: pr-check-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true
    steps:
      - run: 'true'
