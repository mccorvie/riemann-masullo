name: Main state

# Builds main and saves what pull request checks start from: the signature of every declaration
# (scripts/signatures.sh) and the build directory. `PR check` downloads them instead of building
# main again; without them it builds main itself and reaches the same verdict, only later.
#
# It runs on every push to main, and Auto-merge starts it after merging, because a merge made
# with the workflow token does not count as a push. Only runs on main upload `main-state`;
# scripts/ci/base_state.py refuses an artifact of that name from anywhere else.
#
# The build is incremental (#3783): it starts from the previous saved build of main, so that only
# what changed is compiled and the saved state stays within a few merges of main. Lake trusts a
# compiled module whenever its recorded inputs match, so damage to a saved build would be carried
# forward. Three things bound that: a build from scratch every night, a build from scratch
# whenever the toolchain, the dependencies or the build options change, and the `full` switch of
# a manual run. Outputs of modules whose source is gone are deleted (scripts/ci/prune_build.py).
#
# It fails, and saves nothing, when a declaration that the previous saved signatures had is gone
# or has a different statement (scripts/ci/main_statements.py; new declarations are fine). A pull
# request is checked against the newest saved build, not main's tip (#6414), so this is where
# what main merged meanwhile shows. While a run here has failed and no later one has succeeded,
# Auto-merge merges nothing (auto_merge.py, `line_stopped`). When statements changed on purpose,
# run this workflow with the three `accept_*` inputs the failed run's summary prints, after
# reading its list (prompts/integrator.md). The signatures are also saved on their own, as
# `main-signatures`, kept for two weeks, so that a day of failures does not lose the baseline; a
# build from scratch starts a new one when there is none.

# Auto-merge tells a build from scratch by this name: only one of those clears a failure of one.
run-name: ${{ (github.event_name == 'schedule' || inputs.full) && 'Main state, from scratch' || 'Main state' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"       # nightly, from scratch
  workflow_dispatch:
    inputs:
      full:
        description: Build from scratch instead of from the previous saved build
        type: boolean
        default: false
      accept_baseline:
        description: To accept changed statements, the commit of the saved signatures the failed run compared with
        type: string
        default: ""
      accept_target:
        description: and the commit it built (this run must build the same one)
        type: string
        default: ""
      accept_names:
        description: and the declarations to accept, separated by spaces; any other change still fails
        type: string
        default: ""

permissions:
  contents: read
  actions: read                 # to download the previous saved build

# One build at a time, the newest push waiting behind it. A build from scratch has a group of its
# own, so that a push cannot displace it while it waits; when it finishes, its saved build is the
# newest and the next incremental build starts from it.
concurrency:
  group: main-state-${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'incremental' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120        # a build from scratch takes just under an hour (it was 56 minutes on 23 November)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the previous saved build must be for an ancestor of this commit
          persist-credentials: false
      - name: Lint
        run: scripts/lint.sh
      - name: Install Lean
        run: |
          curl -sSfL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Fetch the dependencies and Mathlib's build
        run: lake exe cache get || { sleep 20; lake exe cache get; }
      - name: Start from the previous saved build of main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          FULL: ${{ (github.event_name == 'schedule' || inputs.full) && 'true' || 'false' }}
        run: |
          prev="$RUNNER_TEMP/previous"
          # The signatures to compare statements with, the newest saved for an ancestor by history.
          python3 scripts/ci/base_state.py --signatures --work . --base "$GITHUB_SHA" --out "$RUNNER_TEMP/baseline" ||
            { echo "could not fetch the saved signatures"; echo "BASELINE_UNKNOWN=1" >>"$GITHUB_ENV"; }
          python3 scripts/ci/base_state.py --work . --base "$GITHUB_SHA" --out "$prev" ||
            { echo "could not fetch a saved build; building from scratch"; rm -rf .lake/build; echo "FROM_SCRATCH=1" >>"$GITHUB_ENV"; exit 0; }
          [ -d .lake/build ] || { echo "FROM_SCRATCH=1" >>"$GITHUB_ENV"; exit 0; }
          from=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("sha", ""))' "$prev/meta.json")
          if [ "$FULL" = true ]; then
            echo "building from scratch"
            rm -rf .lake/build
            echo "FROM_SCRATCH=1" >>"$GITHUB_ENV"
            exit 0
          fi
          if ! git diff --quiet "$from" "$GITHUB_SHA" -- lean-toolchain lake-manifest.json lakefile.toml lakefile.lean; then
            echo "the toolchain, the dependencies or the build options changed since $from: building from scratch"
            rm -rf .lake/build
            echo "FROM_SCRATCH=1" >>"$GITHUB_ENV"
            exit 0
          fi
          python3 scripts/ci/prune_build.py
          echo "FROM_SHA=$from" >>"$GITHUB_ENV"
      - name: Build
        # The main library and the comparator files. RiemannMasulloClassField, the fourth default
        # target, needs the class field theory dependency; the Full build workflow builds it.
        run: lake build RiemannMasullo Challenge Main
      - name: Signatures, and no sorry inside definitions
        run: |
          mkdir main-state
          scripts/signatures.sh --all >main-state/signatures.txt
          scripts/signatures.sh --sorry-in-defs main-state/signatures.txt
      # Before anything is uploaded: the summary lists every change, accepted or not.
      - name: No existing statement changed since the saved signatures
        env:
          ACCEPT_BASELINE: ${{ inputs.accept_baseline }}
          ACCEPT_TARGET: ${{ inputs.accept_target }}
          ACCEPT_NAMES: ${{ inputs.accept_names }}
        run: |
          baseline="$RUNNER_TEMP/baseline"
          previous=$(cat "$baseline/previous-signatures.sha" 2>/dev/null || true)
          # Only a baseline known to be missing is started afresh, not one that failed to download.
          scratch=${FROM_SCRATCH:+--from-scratch}
          [ -z "${BASELINE_UNKNOWN:-}" ] || scratch=
          python3 scripts/ci/main_statements.py --target "$GITHUB_SHA" ${previous:+--previous-sha "$previous"} \
            ${scratch:+"$scratch"} --accept-baseline "$ACCEPT_BASELINE" --accept-target "$ACCEPT_TARGET" \
            --accept-names "$ACCEPT_NAMES" "$baseline/previous-signatures.txt" main-state/signatures.txt
      - name: The list of command keywords is up to date
        run: scripts/ci/keywords.sh --check
      - name: Pack the build
        run: |
          tar -C .lake -I 'zstd -T0 -6' -cf main-state/build.tar.zst build
          printf '{"sha": "%s", "from": "%s"}\n' "$GITHUB_SHA" "${FROM_SHA:-}" >main-state/meta.json
          mkdir main-signatures
          cp main-state/signatures.txt main-state/meta.json main-signatures/
          ls -l main-state
          echo "saved the build of ${GITHUB_SHA:0:12}${FROM_SHA:+, built on top of the saved build of ${FROM_SHA:0:12}}" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: main-state
          path: main-state
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: main-signatures     # what the next runs compare statements with (base_state.py --signatures)
          path: main-signatures
          if-no-files-found: error
          retention-days: 14
